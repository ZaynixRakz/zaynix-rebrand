name: Zaynix iOS Rebrand & Build Engine
on:
  workflow_dispatch:
    inputs:
      app_key:
        description: 'Tentukan KEY / KUNCI untuk membuka aplikasi nanti'
        required: true
        default: 'ZAYNIX2026'

jobs:
  build-and-rebrand:
    runs-on: macos-14
    steps:
      - name: Checkout Your Assets
        uses: actions/checkout@v4

      - name: Clone Original 3105 Source Code
        run: |
          git clone https://github.com source_app

      - name: Inject Rebrand Logos
        run: |
          # Mengganti semua aset icon utama di source code sebelum di-compile
          if [ -d "assets" ]; then
            if [ -f "assets/icon.png" ]; then
              cp assets/icon.png source_app/3105/Assets.xcassets/AppIcon.appiconset/
            fi
            if [ -f "assets/AppIcon76x76@2x~ipad.png" ]; then
              cp assets/AppIcon76x76@2x~ipad.png source_app/3105/Assets.xcassets/AppIcon.appiconset/
            fi
          fi

      - name: Rebrand App Name & Menu Strings
        run: |
          # Mengubah display nama aplikasi utama pada file konfigurasi Xcode
          INFO_PLIST="source_app/3105/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Zaynix iOS'" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Zaynix iOS'" "$INFO_PLIST"
          fi
          
          # Mengubah basis data bahasa Inggris internal menu aplikasi
          STRINGS_EN="source_app/3105/en.lproj/Localizable.strings"
          if [ -f "$STRINGS_EN" ]; then
            sed -i '' 's/Open 3105 on GitHub/Open Zaynix on GitHub/g' "$STRINGS_EN"
            sed -i '' 's/Wallpapers added by 3105/Wallpapers added by Zaynix/g' "$STRINGS_EN"
            sed -i '' 's/MobileGestalt capability editor/Zaynix Capability Editor/g' "$STRINGS_EN"
            sed -i '' 's/Developer \& designer/Rebranded by Zaynix/g' "$STRINGS_EN"
            
            # Sistem Layar Kunci bawaan exploit awal
            sed -i '' 's/Requesting exploit access/Aplikasi Terkunci! Masukkan Key Zaynix/g' "$STRINGS_EN"
            sed -i '' 's/Run Exploit/Verifikasi Key Zaynix/g' "$STRINGS_EN"
            sed -i '' 's/Exploit access/Status Verifikasi Kunci/g' "$STRINGS_EN"
            sed -i '' 's/Access is reported as successful/Akses aplikasi berhasil dibuka jika Key yang dimasukkan valid./g' "$STRINGS_EN"
          fi

      - name: Compile and Build Signed IPA
        run: |
          cd source_app
          
          # Membuat arsip build Xcode menggunakan SDK iPhone Simulator / OS generik untuk pembuatan unsigned IPA
          xcodebuild archive \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -archivePath ./build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Mengemas hasil kompilasi binary ke dalam struktur folder Payload standar iOS (.ipa)
          mkdir -p Payload
          cp -r ./build/3105.xcarchive/Products/Applications/3105.app ./Payload/
          mv ./Payload/3105.app ./Payload/Zaynix_iOS.app
          zip -r ../Zaynix_iOS_Final.ipa Payload

      - name: Upload Final Rebranded IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Final-Package
          path: Zaynix_iOS_Final.ipa
          
